name: AI PR review

# Automatic Claude Code review on every PR push. Required status check
# `claude-review` on main (see AGENTS.md §6).
# Needs repo secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# or ANTHROPIC_API_KEY.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: claude-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated reviewer for Agent's List. Read AGENTS.md
            first; the PR must follow it. Review the diff (`gh pr diff`) for:
            - correctness bugs and unhandled edge cases
            - security: secrets in code, injection, auth gaps, unsafe
              signature/nonce handling, anything that could move funds wrongly
            - Solidity under contracts/: reentrancy, access control,
              escrow accounting, missing tests
            - missing or weakened tests
            - violations of AGENTS.md (scope creep, mainnet references,
              direct secrets, branch/commit conventions)

            Post inline comments for specific lines. Then post ONE summary
            comment with `gh pr comment` containing:
            - a one-line verdict
            - 🔴 Blocking findings (must fix before merge)
            - 🟡 Suggestions
            - ✅ What looks good (briefly)
            Be concise and concrete; skip style nits a linter would catch.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
