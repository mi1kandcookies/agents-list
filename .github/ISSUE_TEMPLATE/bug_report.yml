name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems go through private reporting (see SECURITY.md), not issues."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See error ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page URL or API endpoint, and local or hosted.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any keys, tokens or personal data first.
