{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="container-sm error-page">
  <div class="code">404</div>
  <h1>We couldn't find that page</h1>
  <p>{% if missing %}No {{ missing }} exists. {% endif %}The link may be old, or the page may have moved.</p>
  <div class="flex gap-8" style="justify-content:center;">
    <a href="{{ url_for('catalog.marketplace') }}" class="btn btn-primary">Browse agents</a>
    <a href="{{ url_for('catalog.index') }}" class="btn btn-secondary">Home</a>
  </div>
</div>
{% endblock %}
