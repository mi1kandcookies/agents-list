# specialists/support_automation/agent.yaml - manifest v1 for the
# support-automation specialist.
schema_version: 1
slug: support-automation
name: Support Automation Builder
version: 0.1.0
summary: >-
  Turns a help center and a ticket export into a redacted intent map with a
  knowledge-base gap list, gap-filling articles and macros, and a tested
  support-agent configuration with a sealed held-out escalation replay.
listing:
  category: Customer Support
  description: >-
    Vendor-neutral builder for AI support agents. Mines historical tickets
    for intents and volumes, finds what the help center does not answer,
    drafts grounded articles and macros for the biggest gaps, and delivers a
    support-agent configuration (instructions, escalation rules, AI
    disclosure) measured against held-out tickets. Everything is delivered
    as drafts for your support lead; nothing is published or sent to
    customers.
  tags: [customer-support, knowledge-base, helpdesk, macros, escalation, evaluation]
  capabilities:
    - PII redaction of ticket exports (email, phone, card numbers)
    - Intent taxonomy with volume, handle time and escalation rate
    - Knowledge-base coverage and gap map
    - Policy contradiction detection across articles, macros and replies
    - Grounded article and macro drafting
    - Support-agent configuration with must-escalate rules
    - Held-out ticket replay for escalation recall
  pricing: {model: per_milestone, currency: USDC, typical_low: 800, typical_high: 5000}
models: {primary: "anthropic:claude-opus-5", fallbacks: [], grader: "anthropic:claude-sonnet-5"}
profile: docs
prompts:
  system: prompts/system.md
  include: [playbook/method.md, playbook/escalation-policy.md, playbook/article-style.md]
tools:
  - read_document
  - read_file
  - write_file
  - edit_file
  - list_files
  - search_files
  - record_source
  - record_claim
  - ask_client
  - post_progress
  - submit_milestone
  - redact_tickets
  - scan_pii
  - build_intent_taxonomy
  - kb_coverage
  - find_contradictions
  - split_eval_set
  - replay_escalations
shell: {allow: [], timeout_seconds: 300}
egress: {mode: none, allow: []}
limits: {max_steps: 120, max_tokens: 4000000, max_usd: 50, max_wall_minutes: 240}
human_gate:
  required: false
  reviewer_role: support lead / policy owner
  disclaimer: >-
    Draft work product. The specialist never publishes articles, activates
    macros or bots, or replies to customers. A support lead approves every
    article and macro, and the policy owner approves every rule touching
    refunds, credits, cancellations, account security or regulated advice,
    before anything goes live.
  checklist:
    - Every article and macro reviewed by the support lead before publishing
    - Refund, credit, cancellation and account-security wording approved by the policy owner
    - Escalation categories and handoff wording approved
    - AI-disclosure text approved for the channels where the agent will run
intake:
  - {field: ticket_export, question: "Upload a CSV export of 6-12 months of tickets (ticket_id, subject, body; ideally agent_reply, handle_minutes, status and a must_escalate flag) as inputs/tickets.csv.", required: true}
  - {field: help_center, question: "Upload your current help-center articles as Markdown or text files under inputs/help_center/.", required: true}
  - {field: policy_docs, question: "Upload any internal policy documents (refunds, shipping, account security) under inputs/policies/.", required: false}
  - {field: helpdesk_platform, question: "Which helpdesk or AI agent platform will run the configuration (e.g. Zendesk, Intercom, Freshdesk, our runtime)?", required: true}
  - {field: must_escalate_categories, question: "Besides billing disputes, legal threats, safety, account security and vulnerable users, which topics must always go to a human?", required: false}
  - {field: regulated_vertical, question: "Do you operate in a regulated vertical (health, financial services, children's services)? If so, who approves escalation rules and disclosures?", required: true}
  - {field: top_n_gaps, question: "How many of the largest knowledge gaps should milestone 2 fill (default 5)?", required: false}
estimate: {usd_per_hour: 6.0}
milestones:
  - id: m1-discovery
    title: Ticket and knowledge discovery
    description: >-
      Redact the ticket export, build an intent taxonomy with volumes, handle
      times and automation levels, map help-center coverage per intent, and
      list policy contradictions between articles and agent replies.
    deliverables:
      - deliverables/m1-discovery/tickets_redacted.csv
      - deliverables/m1-discovery/intent_rules.json
      - deliverables/m1-discovery/tickets_labeled.csv
      - deliverables/m1-discovery/intent_taxonomy.csv
      - deliverables/m1-discovery/kb_gap_map.csv
      - deliverables/m1-discovery/discovery_report.md
    hours: [3, 8]
    acceptance:
      - {check: files_exist, params: {paths: [deliverables/m1-discovery/tickets_redacted.csv, deliverables/m1-discovery/intent_rules.json, deliverables/m1-discovery/tickets_labeled.csv, deliverables/m1-discovery/intent_taxonomy.csv, deliverables/m1-discovery/kb_gap_map.csv, deliverables/m1-discovery/discovery_report.md]}}
      - {check: redaction_complete, description: "Redacted export keeps every ticket and holds no emails, phones or card numbers", params: {source: inputs/tickets.csv, redacted: deliverables/m1-discovery/tickets_redacted.csv}}
      - {check: no_pii_remaining, params: {paths: [deliverables/m1-discovery]}}
      - {check: json_valid, params: {path: deliverables/m1-discovery/intent_rules.json}}
      - {check: csv_columns, params: {path: deliverables/m1-discovery/intent_taxonomy.csv, columns: [intent, label, automation, volume, share, avg_handle_minutes, escalation_rate]}}
      - {check: taxonomy_reconciles, description: Taxonomy volumes re-derive from the redacted export and cover at least 90% of tickets, params: {tickets: deliverables/m1-discovery/tickets_redacted.csv, rules: deliverables/m1-discovery/intent_rules.json, taxonomy: deliverables/m1-discovery/intent_taxonomy.csv, min_coverage: 0.9}}
      - {check: gap_map_consistent, params: {rules: deliverables/m1-discovery/intent_rules.json, taxonomy: deliverables/m1-discovery/intent_taxonomy.csv, kb_dir: inputs/help_center, gap_map: deliverables/m1-discovery/kb_gap_map.csv}}
      - {check: markdown_sections, params: {path: deliverables/m1-discovery/discovery_report.md, sections: [Summary, Intent taxonomy, Knowledge gaps, Contradictions, Automation candidates, Open questions]}}
      - {check: no_placeholders, params: {paths: [deliverables/m1-discovery/discovery_report.md]}}
      - {check: rubric_grader, kind: rubric, params: {rubric: rubrics/discovery.yaml, paths: [deliverables/m1-discovery/discovery_report.md, deliverables/m1-discovery/intent_taxonomy.csv], threshold: 0.75}}
      - {check: human_signoff, kind: human, description: Support lead confirms the intent labels on a sample of tickets}
  - id: m2-knowledge
    title: Knowledge base gap fill and macros
    description: >-
      Draft grounded help-center articles and macros for the largest
      automatable gaps, resolve contradictions, and log every change.
    deliverables:
      - deliverables/m2-knowledge/articles/
      - deliverables/m2-knowledge/macros.json
      - deliverables/m2-knowledge/change_log.md
    hours: [4, 12]
    acceptance:
      - {check: files_exist, params: {paths: [deliverables/m2-knowledge/macros.json, deliverables/m2-knowledge/change_log.md]}}
      - {check: top_gaps_addressed, description: Each of the top automatable gaps (recomputed against the original help center) has a new article or macro, params: {rules: deliverables/m1-discovery/intent_rules.json, taxonomy: deliverables/m1-discovery/intent_taxonomy.csv, kb_dir: inputs/help_center, articles_dir: deliverables/m2-knowledge/articles, macros: deliverables/m2-knowledge/macros.json, top_n: 5}}
      - {check: articles_grounded, description: Every article declares intents and cites sources that resolve to input files or ticket rows, params: {articles_dir: deliverables/m2-knowledge/articles, rules: deliverables/m1-discovery/intent_rules.json, min_articles: 1}}
      - {check: macros_valid, params: {macros: deliverables/m2-knowledge/macros.json, rules: deliverables/m1-discovery/intent_rules.json}}
      - {check: kb_consistent, description: No policy term carries two different numbers across the delivered articles and macros, params: {terms: [refund, cancel, shipping, delivery, return, trial, warranty], articles_dir: deliverables/m2-knowledge/articles, paths: [deliverables/m2-knowledge/macros.json]}}
      - {check: no_pii_remaining, params: {paths: [deliverables/m2-knowledge]}}
      - {check: ledger_verified, description: Every recorded claim quotes its source verbatim}
      - {check: no_placeholders, params: {paths: [deliverables/m2-knowledge/change_log.md]}}
      - {check: rubric_grader, kind: rubric, params: {rubric: rubrics/articles.yaml, paths: [deliverables/m2-knowledge/articles, deliverables/m2-knowledge/macros.json], threshold: 0.8}}
      - {check: human_signoff, kind: human, description: "Support lead approves every article and macro; policy owner approves refund, credit, cancellation and account-security wording"}
  - id: m3-agent-config
    title: Support-agent configuration and held-out evaluation
    description: >-
      Write the platform-neutral support-agent configuration (instructions,
      escalation rules, handoff and AI-disclosure text), seal a held-out
      ticket set, and replay the escalation rules against it.
    deliverables:
      - deliverables/m3-agent-config/agent_config.json
      - deliverables/m3-agent-config/eval_holdout.csv
      - deliverables/m3-agent-config/build_split.csv
      - deliverables/m3-agent-config/escalation_replay.json
      - deliverables/m3-agent-config/eval_report.md
    hours: [3, 8]
    acceptance:
      - {check: files_exist, params: {paths: [deliverables/m3-agent-config/agent_config.json, deliverables/m3-agent-config/eval_holdout.csv, deliverables/m3-agent-config/build_split.csv, deliverables/m3-agent-config/escalation_replay.json, deliverables/m3-agent-config/eval_report.md]}}
      - {check: json_valid, params: {path: deliverables/m3-agent-config/agent_config.json}}
      - {check: agent_config_valid, params: {config: deliverables/m3-agent-config/agent_config.json}}
      - {check: eval_holdout_sealed, description: "Held-out tickets match the seeded split of the client export, keep its labels and text, and are never cited by an article or macro", params: {tickets: deliverables/m1-discovery/tickets_labeled.csv, source: inputs/tickets.csv, holdout: deliverables/m3-agent-config/eval_holdout.csv, build: deliverables/m3-agent-config/build_split.csv, holdout_fraction: 0.3, seed: support-automation, min_size: 5, articles_dir: deliverables/m2-knowledge/articles, macros: deliverables/m2-knowledge/macros.json}}
      - {check: escalation_recall, description: Must-escalate recall on the held-out set is at least 95% and matches the delivered replay report, params: {config: deliverables/m3-agent-config/agent_config.json, eval: deliverables/m3-agent-config/eval_holdout.csv, report: deliverables/m3-agent-config/escalation_replay.json, min_recall: 0.95}}
      - {check: markdown_sections, params: {path: deliverables/m3-agent-config/eval_report.md, sections: [Summary, Configuration, Escalation replay, Known limitations, Go-live prerequisites]}}
      - {check: no_pii_remaining, params: {paths: [deliverables/m3-agent-config/agent_config.json, deliverables/m3-agent-config/eval_report.md]}}
      - {check: rubric_grader, kind: rubric, params: {rubric: rubrics/agent-config.yaml, paths: [deliverables/m3-agent-config/agent_config.json, deliverables/m3-agent-config/eval_report.md], threshold: 0.8}}
      - {check: human_signoff, kind: human, description: "Policy owner approves escalation categories, handoff and AI-disclosure wording"}
